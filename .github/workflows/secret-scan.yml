name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  trufflehog:
    name: trufflehog (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --results=verified,unknown

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action 在 PR 事件上要读 PR 的提交范围
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  privacy-words:
    name: project privacy rules (no personal data in tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: forbidden artefacts
        run: |
          set -u; bad=0
          # 截图 / 录像 / 审计 / 会话 / 记忆 / 笔记 / 密钥库 一律不得入库
          for pat in '*.jpg' '*.jpeg' '*.png' '*.mkv' '*.mp4' '*audit*.jsonl*' 'MEMORY.md' 'HANDOVER.md' '*.keystore' '*.jks' '.env'; do
            hits=$(git ls-files -- "$pat" ':!docs/**/*.png' ':(top,glob,exclude)app/res/mipmap-*/ic_launcher_foreground.png' ':(top,glob,exclude)app/res/mipmap-*/ic_launcher_monochrome.png' 2>/dev/null); [ -n "$hits" ] && { echo "forbidden file: $hits"; bad=1; }
          done
          # 设备序列号 / 局域网地址 / 个人路径 这类不该出现在公开树里
          if git grep -nIE '/Users/[a-z]+|192\.168\.[0-9]+\.[0-9]+|u0_a[0-9]{3}@' -- . ':!.github/workflows/secret-scan.yml'; then bad=1; fi
          exit $bad
      - name: extended public-tree privacy rules (same checker as release staging)
        run: python3 installer/privacy.py . --tracked
