name: Feature request / 功能建议
description: Hand DSB one more chore, or improve the experience / 想让逗沙包多做一件杂务，或改进体验
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/tianye1999/dsb/blob/main/docs/ROADMAP.md) first; it may already be planned. 先看一眼[路线图](https://github.com/tianye1999/dsb/blob/main/docs/ROADMAP.zh-CN.md)，也许已经在计划里。
        Suggestions that **relax a safety gate** need a real scenario; we do not accept "add a keyword/blocklist" fixes (see CONTRIBUTING). 涉及**放宽安全闸门**的建议需要说明真实场景；不接受「加个关键词/黑名单」式的修法。
  - type: textarea
    id: task
    attributes:
      label: The chore you want to hand over / 你想交给它的杂务
      description: Describe it the way you would say it to DSB, e.g. "check where my parcel is" / 用一句你会对它说的话描述，例如「看看快递到哪了」
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it can't today / 为什么现在做不到
      description: Did a gate block it, could it not understand the page, or is the capability missing? / 是闸门拦了、它看不懂页面、还是根本没有这个能力？
  - type: dropdown
    id: decision
    attributes:
      label: Does this chore include a step a person must decide? / 这件事里有没有需要「人来决定」的环节？
      description: DSB will not do irreversible actions such as pay, send, delete or authorize for you / 付款、发送、删除、授权等不可逆动作逗沙包不会替你做
      options:
        - No, it is read-only throughout / 没有，全程只读
        - Yes, but it can stop at that step and hand over to me / 有，但可以停在那一步交给我
        - Yes, and I want it done automatically (explain below why that is acceptable) / 有，而且我希望它自动做（请在下面说明为什么可以接受）
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else / 其它
